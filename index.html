
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VILEN AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #10121b;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #8496ff;
  font-size: 38px;
  margin-top: 35px;
}

p {
  color: #aaa;
}

input, button {
  width: 100%;
  padding: 15px;
  margin: 9px 0;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
}

input {
  background: #252938;
  color: white;
  border: 1px solid #444;
}

button {
  background: #6578ff;
  color: white;
  font-weight: bold;
}

button:active {
  opacity: 0.7;
}

#status {
  color: #aab8ff;
  margin: 20px 0;
  font-size: 14px;
  overflow-wrap: anywhere;
}

#log {
  text-align: left;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
  margin-top: 25px;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>VILEN AI</h1>
<p>Your personal voice assistant</p>

<input
  id="apiKey"
  type="password"
  placeholder="Paste Gemini API key"
/>

<button onclick="saveKey()">SAVE API KEY</button>

<div id="status">Status: Ready</div>

<button onclick="startVilen()">START LISTENING</button>
<button onclick="stopVilen()">STOP</button>

<div id="log"></div>

<script>
let apiKey = localStorage.getItem("vilen_key") || "";

let recognition = null;
let listening = false;
let speaking = false;
let busy = false;
let recognitionStarting = false;
let restartTimer = null;

const apiInput = document.getElementById("apiKey");
apiInput.value = apiKey;

function statusText(message) {
  document.getElementById("status").textContent =
    "Status: " + message;
}

function addLog(message) {
  const log = document.getElementById("log");
  log.textContent = message + "\n\n" + log.textContent;
}

function saveKey() {
  apiKey = apiInput.value.trim();

  if (!apiKey) {
    statusText("Please enter your API key");
    return;
  }

  localStorage.setItem("vilen_key", apiKey);
  statusText("API key saved successfully");
}

function startVilen() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusText("Speech recognition not supported. Try Chrome.");
    return;
  }

  if (!apiKey) {
    statusText("Please save your Gemini API key first");
    return;
  }

  if (listening) return;

  listening = true;
  statusText("Starting microphone...");
  startRecognition();
}

function scheduleListening() {
  clearTimeout(restartTimer);

  if (!listening || speaking || busy) return;

  restartTimer = setTimeout(() => {
    startRecognition();
  }, 900);
}

function startRecognition() {
  if (!listening || speaking || busy || recognitionStarting) {
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) return;

  recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    recognitionStarting = false;
    statusText("Listening... Bolo Vilen sun raha hai");
  };

  recognition.onresult = async (event) => {
    const spokenText =
      event.results[0][0].transcript.trim();

    if (!spokenText) return;

    addLog("You: " + spokenText);

    await askGemini(spokenText);
  };

  recognition.onerror = (event) => {
    recognitionStarting = false;

    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      listening = false;
      statusText("Microphone permission denied");
      return;
    }

    if (event.error === "no-speech") {
      statusText("No voice detected. Listening again...");
      return;
    }

    statusText("Mic error: " + event.error);
  };

  recognition.onend = () => {
    recognitionStarting = false;

    if (listening && !speaking && !busy) {
      scheduleListening();
    }
  };

  try {
    recognitionStarting = true;
    recognition.start();
  } catch (error) {
    recognitionStarting = false;
    scheduleListening();
  }
}

async function askGemini(question) {
  if (busy) return;

  busy = true;
  statusText("Vilen is thinking...");

  try {
    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=" +
      encodeURIComponent(apiKey),
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          systemInstruction: {
            parts: [{
              text:
                "You are Vilen, a sharp, confident and helpful personal AI assistant. Speak in simple natural Hinglish. Keep answers concise, practical and friendly. Do not use complicated words."
            }]
          },

          contents: [{
            role: "user",
            parts: [{
              text: question
            }]
          }]
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message || "Gemini API request failed"
      );
    }

    const answer =
      data.candidates?.[0]?.content?.parts
        ?.map(part => part.text || "")
        .join("") || "Mujhe jawab nahi mila.";

    addLog("Vilen: " + answer);

    busy = false;
    say(answer);

  } catch (error) {
    busy = false;

    statusText("Error: " + error.message);

    say("Sorry, kuch problem aa gayi. Dobara try karo.");
  }
}

function say(text) {
  if (!("speechSynthesis" in window)) {
    statusText("Text reply ready. Voice not supported.");
    scheduleListening();
    return;
  }

  clearTimeout(restartTimer);

  speaking = true;
  statusText("Vilen is speaking...");

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "en-IN";
  utterance.rate = 1;
  utterance.pitch = 0.85;

  utterance.onend = () => {
    speaking = false;

    if (listening) {
      statusText("Listening again...");
      scheduleListening();
    }
  };

  utterance.onerror = () => {
    speaking = false;
    scheduleListening();
  };

  speechSynthesis.speak(utterance);
}

function stopVilen() {
  listening = false;
  speaking = false;
  busy = false;
  recognitionStarting = false;

  clearTimeout(restartTimer);

  if (recognition) {
    try {
      recognition.stop();
    } catch (error) {}
  }

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  statusText("Vilen stopped");
}
</script>

</body>
</html>
